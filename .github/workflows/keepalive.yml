name: keepalive
# GitHub pauses scheduled workflows in a public repository after 60 days
# without activity; one empty commit a month keeps the uptime check running.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'uptime-keepalive'
          git config user.email 'uptime-keepalive@users.noreply.github.com'
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
          git push
